<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <!-- CSS External File -->
    <link rel="stylesheet" href="css/style.css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
  <body>
    <section class="container">
      <!-- Header Section -->
      <header>
        <h1>TO DO LIST</h1>
      </header>

      <!-- Content Section -->
      <section class="top">
        <input type="text" id="taskInput" placeholder="Add a todo..." />
        <input type="date" id="dateInput" />
        <button id="addTaskButton">Add</button>
      </section>
      <section class="middle">
        <label class="filter-label">Filter:</label>
        <select id="filterButton">
          <option value="all">All</option>
          <option value="pending">Pending</option>
          <option value="completed">Completed</option>
        </select>
        <button id="deleteAllButton">Delete All</button>
      </section>
      <section class="bottom">
        <table>
          <thead>
            <tr>
              <th>Task</th>
              <th>Due Date</th>
              <th>Status</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="todoList">
            <tr>
              <td colspan="4" style="text-align: center">No task found</td>
            </tr>
          </tbody>
        </table>
        <footer>
          <p>&copy; 2025 Dhea To Do List App</p>
        </footer>
      </section>
    </section>
  </body>
  <script src="js/script.js"></script>
</html>
